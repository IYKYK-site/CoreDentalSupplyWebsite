# ------------------------------------------------------------------
# PROCEDURES
# The durations below are temporary defaults for development.
# They will be replaced with office-specific values after validation.
# ------------------------------------------------------------------

appointments:
  scheduling_system: "google_calendar"
  calendar_id: "primary"
  default_duration_minutes: 60
  slot_increment_minutes: 30
  default_buffer_minutes: 0

late_arrival:
  grace_period_minutes: 10
  escalation_threshold_minutes: 11
  reschedule_threshold_minutes: 30
  behaviors:
    within_grace:
      action: "still_come"
      message: >-
        You are within the office's normal grace period and may still come
        to your appointment.
    escalation:
      action: "reschedule"
      message: >-
        You are beyond the normal grace period. We can look for another
        appointment time.
    reschedule:
      action: "reschedule"
      message: >-
        Based on the office's late-arrival policy, we should look for another
        appointment time.

fallback:
  phone: "305-773-3604"
  enabled: true

knowledge:
  services: []
  insurance:
    accepted_plans:
      - "Cigna"
      - "BlueCross/BlueShield"
      - "Aetna"
      - "UnitedHealthcare"
      - "Leon Medical"
  parking: ""
  new_patient_instructions: ""
  office_policies: ""
  additional_facts: []
lunch:
  enabled: true
  start: "12:00"
  end: "13:00"

appointment_types:
  default:
    duration_minutes: 60
    buffer_minutes: 0

sms:
  enabled: true

  messages:

    address:
      enabled: true
      offer_after_response: true
      message: |
        Dr. Novoa's Office
        10551 NW 52nd Terrace
        Doral, FL 33178

        Directions:
        https://maps.google.com/?q=10551+NW+52nd+Terrace+Doral+FL+33178

        Reply STOP to opt out.

    doctor_bio:
      enabled: true
      offer_after_response: true
      message: |
        Learn more about Dr. Novoa:

        {{bio_url}}

        Reply STOP to opt out.

    insurance:
      enabled: true
      offer_after_response: true
      message: |
        Insurance information:

        {{insurance_url}}

        Reply STOP to opt out.

    patient_forms:
      enabled: true
      offer_after_response: true
      message: |
        Patient Forms

        Please complete your paperwork before arriving:

        {{forms_url}}

        Reply STOP to opt out.

    urgent_contact:
      enabled: true
      offer_after_response: false
      message: |
        Urgent Dental Contact

        Please call the office immediately:

        {{office_phone}}

        If this becomes a medical emergency, call 911.

        Reply STOP to opt out.

    appointment_confirmation:
      enabled: true
      offer_after_response: true
      message: |
        Appointment Confirmation

        Patient: {{patient_name}}
        Doctor: {{doctor}}
        Date: {{date}}
        Time: {{time}}
        Reason: {{reason}}

        Location:
        {{office_address}}

        Reply STOP to opt out.
